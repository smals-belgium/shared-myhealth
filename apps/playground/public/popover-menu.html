<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Vitals Playground - popover-menu</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="/src/styles.css"
    />
    <style>
      mh-icon-button {
        margin: 100px;
      }
    </style>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </head>

  <body>
    <h2>Popover Menu</h2>
    <mh-icon-button
      name="more_vert"
      label="little menu"
      popovertarget="menu"
    >
    </mh-icon-button>

    <mh-popover-menu id="menu">
      <mh-button>Edit</mh-button>
      <mh-a>Delete</mh-a>
      <mh-a disabled>Disabled</mh-a>
    </mh-popover-menu>
  </body>
</html>
