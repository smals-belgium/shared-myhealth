<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Vitals Playground - radio</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="/src/styles.css"
    />
    <style>
      mh-radio {
        width: 100%;
        padding: var(--mh-space-xs) 0;
        border-bottom: 1px solid var(--mh-color-neutral-border-quiet);
      }

      fieldset,
      mh-radio::part(label) {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        min-width: 0;
        gap: var(--mh-space-xs);
      }
    </style>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
    <script
      type="module"
      src="/src/form.ts"
    ></script>
  </head>

  <body>
    <form id="form">
      <h2>Radio</h2>
      gender:
      <mh-radio
        name="gender"
        value="f"
      >
        I'm a lady
      </mh-radio>
      <mh-radio
        name="gender"
        value="m"
        checked
      >
        I'm a gentleman
      </mh-radio>
      <mh-radio
        name="gender"
        value="x"
        disabled
      >
        I don't know
      </mh-radio>

      <fieldset>
        <legend>Select a profile</legend>
        <mh-radio
          name="profile"
          value="dad"
        >
          Daddy
          <mh-chip><mh-icon name="person"></mh-icon>Me</mh-chip>
        </mh-radio>
        <mh-radio
          name="profile"
          value="mom"
        >
          Mommy
          <mh-chip>My wife</mh-chip>
        </mh-radio>
        <mh-radio
          name="profile"
          value="son"
        >
          Sonny
          <mh-chip>The heir</mh-chip>
        </mh-radio>
        <mh-radio
          name="profile"
          value="daughter"
        >
          Princess
          <mh-chip>My baby</mh-chip>
        </mh-radio>
      </fieldset>

      <footer>
        <mh-button type="submit">submit</mh-button>
        <mh-button
          type="reset"
          appearance="outlined"
          >reset
        </mh-button>
      </footer>
    </form>
  </body>
</html>
